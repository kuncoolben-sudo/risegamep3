<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RISE English Adventure</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Mali:wght@400;600;700&family=Fredoka:wght@500;700&display=swap" rel="stylesheet" />
  </head>
  <body>
    <div id="root"><p id="boot" style="font:16px sans-serif;padding:24px;color:#4a2c17">กำลังโหลดเกม…</p></div>
    <script>
      // shows startup errors on screen (e.g. old browsers) instead of a blank page
      function showBootError(msg) {
        var el = document.getElementById('boot') || document.getElementById('root');
        if (el && !document.querySelector('.app')) el.innerHTML = '<pre style="white-space:pre-wrap;font:14px monospace;padding:24px;color:#b00020">เปิดเกมไม่สำเร็จ\n' + String(msg).replace(/</g, '&lt;') + '</pre>';
      }
      setTimeout(function () {
        if (!window.__booted) showBootError('เกมยังไม่เริ่มทำงานใน 6 วินาที (ไฟล์สคริปต์โหลดไม่ได้?)\nลองปิดแท็บแล้วเปิดใหม่ หรือใช้เบราว์เซอร์เวอร์ชันล่าสุด\n' + navigator.userAgent);
      }, 6000);
      // a <script> that fails to load fires 'error' on the element only (capture phase needed)
      window.addEventListener('error', function (e) {
        if (!e.target || e.target.tagName !== 'SCRIPT') return;
        if (/\/src\/main\.tsx$/.test(e.target.src)) {
          showBootError('หน้านี้เป็นไฟล์ต้นฉบับที่ยังไม่ได้ build (GitHub Pages ไม่ได้ใช้ GitHub Actions)\nไปที่ repo → Settings → Pages → Source เลือก "GitHub Actions" แล้วรัน workflow "Deploy to GitHub Pages"\nจากนั้นเปิดลิงก์: ' + location.origin + location.pathname.replace(/[^\/]*$/, ''));
        } else {
          showBootError('โหลดไฟล์เกมไม่ได้: ' + e.target.src);
        }
      }, true);
      window.addEventListener('error', function (e) { showBootError(e.message + (e.filename ? '\n' + e.filename + ':' + e.lineno : '')); });
      window.addEventListener('unhandledrejection', function (e) { showBootError(e.reason && e.reason.message || e.reason); });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
